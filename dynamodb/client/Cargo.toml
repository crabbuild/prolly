[package]
name = "prolly-dynamodb-client"
description = "AWS SDK-shaped Rust client for versioned logical DynamoDB tables over Prolly."
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabbuild/prolly"

[dependencies]
aws-sdk-dynamodb = "=1.73.0"
futures-util = "0.3"
prolly = { package = "prolly-map", path = "../..", version = "0.7.0", features = ["async-store", "tokio"] }
prolly-dynamodb-core = { path = "../core", version = "0.1.0" }
prolly-store-dynamodb = { path = "../../stores/prolly-store-dynamodb", version = "0.6.0" }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
aws-config = { version = "=1.5.18", features = ["behavior-version-latest"] }
aws-smithy-types = "=1.5.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
