[package]
name = "prolly-dynamodb-admin"
description = "Explicit administrative CLI for the in-process versioned DynamoDB client."
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabbuild/prolly"
publish = false

[dependencies]
anyhow = "1.0"
aws-config = { version = "=1.5.18", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "=1.73.0"
clap = { version = "4.5", features = ["derive", "env"] }
prolly = { package = "prolly-map", path = "../..", version = "0.7.0" }
prolly-dynamodb-client = { path = "../client", version = "0.1.0" }
prolly-dynamodb-core = { path = "../core", version = "0.1.0" }
prolly-store-dynamodb = { path = "../../stores/prolly-store-dynamodb", version = "0.6.0" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
