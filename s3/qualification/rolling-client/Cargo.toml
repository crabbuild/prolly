[package]
name = "prolly-s3-rolling-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[workspace]

[dependencies]
aws-config = "1.10.1"
aws-credential-types = "1.3"
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
prolly-s3-client = { version = "0.1.0", default-features = false }
sha2 = "0.10"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
prolly-s3-client = { path = "../../client" }
prolly-s3-core = { path = "../../core" }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(prolly_s3_legacy_v1_codec)'] }
