<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Prolly S3 cache and scale architecture</title>
  <desc id="desc">A layered architecture showing bounded requests flowing through memory and disk caches, sharded immutable indexes, authoritative S3 objects, and background maintenance.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".22" stroke-width="1"/></pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity=".55"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:28px;font-weight:700;fill:#f8fafc}.subtitle{font-size:14px;fill:#94a3b8}.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#94a3b8}.boxTitle{font-size:16px;font-weight:700;fill:#f8fafc}.body{font-size:12px;fill:#cbd5e1}.small{font-size:11px;fill:#94a3b8}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#bae6fd}.edge{fill:none;stroke:#38bdf8;stroke-width:2;marker-end:url(#arrow)}.async{fill:none;stroke:#34d399;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#0f172a"/><rect width="1200" height="820" fill="url(#grid)"/>
  <text x="56" y="52" class="title">Prolly S3 — cache and unbounded-cardinality architecture</text>
  <text x="56" y="78" class="subtitle">Bounded work on every path · immutable data cached by identity · S3 remains authoritative</text>

  <rect x="40" y="108" width="1120" height="118" rx="18" fill="#172033" stroke="#334155"/>
  <text x="62" y="134" class="zone">BOUNDED API</text>
  <g filter="url(#shadow)">
    <rect x="76" y="151" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="96" y="174" class="boxTitle">Exact read / write</text><text x="96" y="191" class="small">Pinned commit + key</text>
    <rect x="350" y="151" width="220" height="52" rx="10" fill="#1e293b" stroke="#a78bfa"/><text x="370" y="174" class="boxTitle">Paged scan</text><text x="370" y="191" class="small">Opaque continuation cursor</text>
    <rect x="624" y="151" width="220" height="52" rx="10" fill="#1e293b" stroke="#a78bfa"/><text x="644" y="174" class="boxTitle">History / diff</text><text x="644" y="191" class="small">Time + byte + visit budget</text>
    <rect x="898" y="151" width="220" height="52" rx="10" fill="#1e293b" stroke="#f59e0b"/><text x="918" y="174" class="boxTitle">Ref operation</text><text x="918" y="191" class="small">Independent CAS per ref</text>
  </g>

  <rect x="40" y="254" width="1120" height="190" rx="18" fill="#14243a" stroke="#0ea5e9" stroke-opacity=".65"/>
  <text x="62" y="280" class="zone">READ-THROUGH CACHE — NEVER AUTHORITY</text>
  <g filter="url(#shadow)">
    <rect x="76" y="302" width="205" height="98" rx="12" fill="#172554" stroke="#60a5fa"/><text x="96" y="329" class="boxTitle">L0 pending</text><text x="96" y="351" class="body">New verified nodes</text><text x="96" y="371" class="body">No network read</text><text x="96" y="389" class="mono">CID → bytes</text>
    <rect x="330" y="302" width="205" height="98" rx="12" fill="#172554" stroke="#60a5fa"/><text x="350" y="329" class="boxTitle">L1 memory</text><text x="350" y="351" class="body">Tiny, fastest tier</text><text x="350" y="371" class="body">Capacity bounded</text><text x="350" y="389" class="mono">verified nodes</text>
    <rect x="584" y="302" width="205" height="98" rx="12" fill="#172554" stroke="#60a5fa"/><text x="604" y="329" class="boxTitle">L2 local disk</text><text x="604" y="351" class="body">Foyer adapter</text><text x="604" y="371" class="body">Scan-resistant eviction</text><text x="604" y="389" class="mono">digest checked</text>
    <rect x="838" y="302" width="246" height="98" rx="12" fill="#172554" stroke="#60a5fa"/><text x="858" y="329" class="boxTitle">Request coalescer</text><text x="858" y="351" class="body">One fetch per missing CID</text><text x="858" y="371" class="body">Repository quotas</text><text x="858" y="389" class="mono">singleflight + deadline</text>
  </g>
  <path d="M281 351H330M535 351H584M789 351H838" class="edge"/>

  <rect x="40" y="472" width="1120" height="150" rx="18" fill="#1d1a34" stroke="#8b5cf6" stroke-opacity=".65"/>
  <text x="62" y="498" class="zone">LAZY IMMUTABLE INDEXES</text>
  <g filter="url(#shadow)">
    <rect x="76" y="520" width="238" height="70" rx="11" fill="#2e2450" stroke="#a78bfa"/><text x="96" y="548" class="boxTitle">Node-index manifest</text><text x="96" y="571" class="body">CID prefix → shard root</text>
    <rect x="353" y="520" width="238" height="70" rx="11" fill="#2e2450" stroke="#a78bfa"/><text x="373" y="548" class="boxTitle">Sorted shard pages</text><text x="373" y="571" class="body">CID → envelope range</text>
    <rect x="630" y="520" width="238" height="70" rx="11" fill="#2e2450" stroke="#a78bfa"/><text x="650" y="548" class="boxTitle">Commit graph segments</text><text x="650" y="571" class="body">Generation + skip pointers</text>
    <rect x="907" y="520" width="177" height="70" rx="11" fill="#2e2450" stroke="#a78bfa"/><text x="927" y="548" class="boxTitle">Ref catalog</text><text x="927" y="571" class="body">Listing only</text>
  </g>
  <path d="M314 555H353M591 555H630M868 555H907" class="edge"/>

  <rect x="40" y="650" width="760" height="130" rx="18" fill="#142b27" stroke="#10b981" stroke-opacity=".7"/>
  <text x="62" y="676" class="zone">AUTHORITATIVE VERSIONED S3</text>
  <g filter="url(#shadow)">
    <rect x="76" y="697" width="205" height="54" rx="10" fill="#12352f" stroke="#34d399"/><text x="96" y="720" class="boxTitle">Refs + index heads</text><text x="96" y="739" class="small">Conditional mutable objects</text>
    <rect x="316" y="697" width="205" height="54" rx="10" fill="#12352f" stroke="#34d399"/><text x="336" y="720" class="boxTitle">Commit envelopes</text><text x="336" y="739" class="small">Immutable nodes + commit</text>
    <rect x="556" y="697" width="205" height="54" rx="10" fill="#12352f" stroke="#34d399"/><text x="576" y="720" class="boxTitle">Payload versions</text><text x="576" y="739" class="small">Whole objects by VersionId</text>
  </g>

  <rect x="828" y="650" width="332" height="130" rx="18" fill="#302414" stroke="#f59e0b" stroke-opacity=".75"/>
  <text x="850" y="676" class="zone">BACKGROUND, RESUMABLE</text>
  <text x="856" y="708" class="boxTitle">Index compaction · graph indexing</text>
  <text x="856" y="734" class="boxTitle">Partitioned GC · reconciliation</text>
  <text x="856" y="758" class="small">Independent quotas, cursors, checkpoints</text>

  <path d="M186 203V302" class="edge"/><path d="M961 400V520" class="edge"/><path d="M472 400V520" class="edge"/><path d="M195 590V697" class="edge"/><path d="M472 590V697" class="edge"/><path d="M749 590L658 697" class="edge"/><path d="M995 590L220 697" class="edge"/>
  <path d="M994 650V622M994 622L472 590" class="async"/>
</svg>
