<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Four-call Prolly S3 write path</title>
  <desc id="desc">Branch authority validation precedes a whole-object payload write, one combined Prolly commit-envelope write, and one conditional branch reference update. Only the final update makes the version visible.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
      .title { fill: #f8fafc; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 9px; }
      .name { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .detail { fill: #94a3b8; font-size: 9px; }
      .number { fill: #0f172a; font-size: 11px; font-weight: 700; }
      .arrow { fill: none; stroke: #22d3ee; stroke-width: 1.5; marker-end: url(#arrow-cyan); }
    </style>
  </defs>

  <rect width="1000" height="430" fill="#0f172a"/>
  <rect width="1000" height="430" fill="url(#grid)"/>

  <text id="title-text" x="30" y="38" class="title">Warm whole-object write · 4 foreground S3 calls</text>
  <text x="30" y="58" class="subtitle">Authority is branch-scoped; independent branch owners validate and publish concurrently.</text>

  <!-- Connectors are painted before opaque component masks. -->
  <path d="M235 202H265" class="arrow"/>
  <path d="M470 202H500" class="arrow"/>
  <path d="M705 202H735" class="arrow"/>

  <!-- Opaque masks -->
  <rect x="30" y="135" width="205" height="134" rx="8" fill="#0f172a"/>
  <rect x="265" y="135" width="205" height="134" rx="8" fill="#0f172a"/>
  <rect x="500" y="135" width="205" height="134" rx="8" fill="#0f172a"/>
  <rect x="735" y="135" width="205" height="134" rx="8" fill="#0f172a"/>

  <!-- Step 1: branch authority -->
  <rect x="30" y="135" width="205" height="134" rx="8" fill="rgba(14,116,144,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="56" cy="161" r="14" fill="#22d3ee"/>
  <text x="56" y="165" class="number" text-anchor="middle">1</text>
  <text x="132" y="181" class="name" text-anchor="middle">GET authority point</text>
  <text x="132" y="204" class="detail" text-anchor="middle">validate owner + generation</text>
  <text x="132" y="224" class="detail" text-anchor="middle">scope: branch/&lt;name&gt;</text>
  <text x="132" y="248" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">WRITER ACTIVE</text>

  <!-- Step 2: data plane -->
  <rect x="265" y="135" width="205" height="134" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="291" cy="161" r="14" fill="#34d399"/>
  <text x="291" y="165" class="number" text-anchor="middle">2</text>
  <text x="367" y="181" class="name" text-anchor="middle">PUT whole object</text>
  <text x="367" y="204" class="detail" text-anchor="middle">original key · one version</text>
  <text x="367" y="224" class="detail" text-anchor="middle">capture VersionId + checksums</text>
  <text x="367" y="248" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">BYTES DURABLE</text>

  <!-- Step 3: combined metadata closure -->
  <rect x="500" y="135" width="205" height="134" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="526" cy="161" r="14" fill="#a78bfa"/>
  <text x="526" y="165" class="number" text-anchor="middle">3</text>
  <text x="602" y="181" class="name" text-anchor="middle">PUT commit envelope</text>
  <text x="602" y="204" class="detail" text-anchor="middle">commit + new Prolly nodes</text>
  <text x="602" y="224" class="detail" text-anchor="middle">one immutable object</text>
  <text x="602" y="248" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">CLOSURE DURABLE</text>

  <!-- Step 4: visibility -->
  <rect x="735" y="135" width="205" height="134" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="761" cy="161" r="14" fill="#fbbf24"/>
  <text x="761" y="165" class="number" text-anchor="middle">4</text>
  <text x="837" y="181" class="name" text-anchor="middle">CAS branch ref</text>
  <text x="837" y="204" class="detail" text-anchor="middle">conditional PUT</text>
  <text x="837" y="224" class="detail" text-anchor="middle">no successful-CAS readback</text>
  <text x="837" y="248" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle">LOGICALLY VISIBLE</text>

  <rect x="60" y="314" width="880" height="66" rx="8" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <text x="80" y="338" fill="#cbd5e1" font-size="9" font-weight="600">Failure behavior</text>
  <text x="80" y="359" class="detail">Before step 4: unreachable data is safe for exact-version GC · ambiguous payload: reconcile OperationId · ambiguous CAS: reload the ref</text>
</svg>
