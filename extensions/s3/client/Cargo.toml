[package]
name = "prolly-s3-client"
description = "AWS SDK-shaped client for bucket-level versioned S3 repositories."
edition = "2021"
rust-version = "1.94.1"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabbuild/prolly"

[features]
default = []
slatedb-index = ["dep:slatedb"]

[dependencies]
async-trait = "0.1"
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-runtime-api = "1.9"
aws-smithy-types = { version = "1.3", features = ["http-body-1-x"] }
aws-types = "1.3"
bytes = "1.10"
base64 = "0.22"
futures-util = "0.3"
hmac = "0.12"
http-body = "1"
md-5 = "0.10"
percent-encoding = "2.3"
hex = "0.4"
prolly-s3-core = { path = "../core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
sha2 = "0.10"
slatedb = { version = "0.14.0", default-features = false, features = ["aws"], optional = true }
thiserror = "2.0"
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
