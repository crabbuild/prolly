[package]
name = "prolly-dynamodb-core"
description = "Transport-independent DynamoDB-compatible logical model over Prolly maps."
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabbuild/prolly"

[dependencies]
getrandom = "0.3"
futures-util = "0.3"
num-bigint = "0.4"
prolly = { package = "prolly-map", path = "../../..", version = "0.7.0" }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2.0"

[dev-dependencies]
futures-util = "0.3"
proptest = "1.7"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
