name: prolly-store-services

services:
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:a8b93e25520e999d867ed3949e7de7f4ff3ddab23ca95fa6f90230de5dd9729b
    environment:
      ENABLE_EXPLORER: "false"
      ENABLE_INIT_DATA: "true"
      ENABLE_TELEMETRY: "false"
      PROTOCOL: "http"
    ports:
      - "${PROLLY_STORE_COSMOS_PORT:-58081}:8081"
      - "${PROLLY_STORE_COSMOS_HEALTH_PORT:-58080}:8080"
    volumes:
      - "./stores/prolly-store-cosmosdb/tests/emulator-init:/init:ro"

  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator@sha256:ad54472fe7b161b9214f7f816f304b649a4779e348229c375ac067f5ed5a6422
    ports:
      - "${PROLLY_STORE_SPANNER_GRPC_PORT:-9010}:9010"
      - "${PROLLY_STORE_SPANNER_REST_PORT:-9020}:9020"

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${PROLLY_STORE_DYNAMODB_PORT:-8000}:8000"

  redis:
    image: redis:7-alpine
    ports:
      - "${PROLLY_STORE_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prolly
      POSTGRES_PASSWORD: prolly
      POSTGRES_USER: prolly
    ports:
      - "${PROLLY_STORE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolly -d prolly"]
      interval: 2s
      timeout: 2s
      retries: 60

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: prolly
      MYSQL_PASSWORD: prolly
      MYSQL_ROOT_PASSWORD: prolly
      MYSQL_USER: prolly
    ports:
      - "${PROLLY_STORE_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uprolly -pprolly --silent"]
      interval: 2s
      timeout: 2s
      retries: 90
