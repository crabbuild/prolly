name: Secondary index required

on:
  pull_request:
    paths:
      - "src/prolly/secondary_index/**"
      - "src/prolly/error.rs"
      - "src/prolly/versioned_map.rs"
      - "bindings/**"
      - "stores/prolly-store-sqlite/**"
      - "tests/secondary_index*"
      - "tests/conformance_fixtures.rs"
      - "conformance/**"
      - "scripts/*secondary-index*"
      - ".github/workflows/secondary-index-*.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: RUSTDOCFLAGS="-D warnings" cargo test --doc
      - run: >-
          cargo test
          --test conformance_fixtures
          --test node_publication
          --test secondary_index
          --test secondary_index_concurrency
          --test secondary_index_faults
          --test secondary_index_fuzz_smoke
          --test secondary_index_resources
      - run: ./scripts/check-secondary-index-cutover.sh

  bounded-benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: PROLLY_INDEX_BENCH_SAMPLES=3 PROLLY_INDEX_BENCH_SCALE=1000 ./scripts/run-secondary-index-bench.sh
      - run: test -s target/secondary-index-bench.csv
      - run: test -s target/secondary-index-bench.summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: secondary-index-benchmark-smoke
          path: |
            target/secondary-index-bench.csv
            target/secondary-index-bench.summary.json

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: >-
          RUSTFLAGS="-Zsanitizer=address"
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --test secondary_index --test secondary_index_concurrency
          --test secondary_index_faults --test secondary_index_fuzz_smoke
          --test secondary_index_resources

  production-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path stores/prolly-store-sqlite/Cargo.toml indexed_profile_
      - run: cargo test --manifest-path stores/prolly-store-sqlite/Cargo.toml production_indexed_profile_

  binding-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo check --manifest-path bindings/uniffi/Cargo.toml --all-targets
      - run: cargo check --manifest-path bindings/node/native/Cargo.toml --all-targets
      - run: cargo check --manifest-path bindings/wasm/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo build --manifest-path bindings/uniffi/Cargo.toml
      - run: >-
          LD_LIBRARY_PATH="$PWD/target/debug"
          mvn -q -f bindings/pom.xml -pl java -am
          -Dtest=PortableParityTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - run: python3 -m py_compile bindings/python/prolly/uniffi/prolly.py
      - run: ruby -c bindings/ruby/lib/prolly/generated/prolly.rb
      - run: npm --prefix bindings/node ci
      - run: npm --prefix bindings/node run build:native
      - run: node --test bindings/node/test/portable-parity.test.ts
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: npm --prefix bindings/wasm run build:wasm
      - run: node --test bindings/wasm/test/portable-parity.test.ts

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo rustdoc --lib --features async-store -- -Z unstable-options --output-format json
      - run: python3 scripts/binding_api_inventory.py check
