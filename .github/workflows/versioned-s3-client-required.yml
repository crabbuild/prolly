name: Versioned S3 client required

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "extensions/s3/**"
      - "plans/020-versioned-s3-client-adapter.md"
      - ".github/workflows/versioned-s3-client-required.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLIENT_TOOLCHAIN: "1.94.1"
  CORE_TOOLCHAIN: "1.89.0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: versioned-s3-quality-1.94.1
      - name: Install pinned dependency auditor
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Format and dependency security
        run: |
          cargo +"$CLIENT_TOOLCHAIN" fmt --manifest-path extensions/s3/Cargo.toml --all -- --check
          bash extensions/s3/scripts/check_dependency_security.sh
      - name: Strict Clippy
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" clippy --locked
          --manifest-path extensions/s3/Cargo.toml --workspace --all-targets --all-features
          -- -D warnings
      - name: Behavioral and compatibility suite
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" test --locked
          --manifest-path extensions/s3/Cargo.toml --workspace --all-features
          -- --skip seeded_histories_are_identical_across_stores_and_restart
      - name: Start pinned RustFS
        env:
          PROLLY_RUSTFS_DATA_DIR: ${{ runner.temp }}/prolly-rustfs-data
        run: |
          # The pinned image runs as rustfs (UID/GID 10001), so prepare the
          # bind mount for that unprivileged user before starting Compose.
          sudo install -d -o 10001 -g 10001 -m 0750 "$PROLLY_RUSTFS_DATA_DIR"
          docker compose -f extensions/s3/docker-compose.rustfs.yml up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f extensions/s3/docker-compose.rustfs.yml logs --no-color
          exit 1
      - name: Required RustFS integration suite
        env:
          PROLLY_S3_RUSTFS: "1"
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" test --locked
          --manifest-path extensions/s3/Cargo.toml
          -p prolly-s3-client --test rustfs_repository -- --nocapture
      - name: RustFS diagnostics
        if: failure()
        run: docker compose -f extensions/s3/docker-compose.rustfs.yml logs --no-color
      - name: Stop RustFS
        if: always()
        env:
          PROLLY_RUSTFS_DATA_DIR: ${{ runner.temp }}/prolly-rustfs-data
        run: docker compose -f extensions/s3/docker-compose.rustfs.yml down -v
      - name: Independent protocol structure verifiers
        run: |
          python3 extensions/s3/spec/prolly-s3/conformance/verify.py
      - name: AWS qualification gate fails closed without operator inputs
        run: |
          if PROLLY_S3_AWS_PERF=0 cargo +"$CLIENT_TOOLCHAIN" test --locked \
            --manifest-path extensions/s3/Cargo.toml \
            -p prolly-s3-client --test aws_performance_qualification \
            -- --ignored --exact aws_hot_branch_performance_release_gate; then
            echo "AWS qualification gate unexpectedly passed without operator inputs" >&2
            exit 1
          fi
          echo "AWS_QUALIFICATION_GATE_CONTRACT fail_closed=verified"

  msrv-and-downstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: rustup toolchain install "$CORE_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: versioned-s3-msrv-1.89.0-1.94.1
      - name: Exact core MSRV
        run: >-
          cargo +"$CORE_TOOLCHAIN" check --locked
          --manifest-path extensions/s3/Cargo.toml -p prolly-s3-core
      - name: Exact client baseline and minimal surface
        run: |
          cargo +"$CLIENT_TOOLCHAIN" check --locked --manifest-path extensions/s3/Cargo.toml --workspace --all-features
          cargo +"$CLIENT_TOOLCHAIN" check --locked --manifest-path extensions/s3/Cargo.toml -p prolly-s3-client --no-default-features
      - name: Locked clean-downstream consumers
        run: bash extensions/s3/scripts/check_clean_downstream.sh
