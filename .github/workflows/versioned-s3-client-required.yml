name: Versioned S3 client required

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "s3/**"
      - "plans/020-versioned-s3-client-adapter.md"
      - ".github/workflows/versioned-s3-client-required.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLIENT_TOOLCHAIN: "1.94.1"
  CORE_TOOLCHAIN: "1.89.0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: versioned-s3-quality-1.94.1
      - name: Install pinned dependency auditor
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Format and dependency security
        run: |
          cargo +"$CLIENT_TOOLCHAIN" fmt --manifest-path s3/Cargo.toml --all -- --check
          bash s3/scripts/check_dependency_security.sh
      - name: Strict Clippy
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" clippy --locked
          --manifest-path s3/Cargo.toml --workspace --all-targets --all-features
          -- -D warnings
      - name: Behavioral and compatibility suite
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" test --locked
          --manifest-path s3/Cargo.toml --workspace --all-features
          -- --skip seeded_histories_are_identical_across_stores_and_restart
      - name: Independent canonical-format verifier
        run: python3 s3/fixtures/verify_canonical_v1.py
      - name: Soak evidence verifier contracts
        run: python3 -m unittest s3.scripts.tests.test_verify_soak_evidence

  msrv-and-downstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: rustup toolchain install "$CORE_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: versioned-s3-msrv-1.89.0-1.94.1
      - name: Exact core MSRV
        run: >-
          cargo +"$CORE_TOOLCHAIN" check --locked
          --manifest-path s3/Cargo.toml -p prolly-s3-core
      - name: Exact client baseline and minimal surface
        run: |
          cargo +"$CLIENT_TOOLCHAIN" check --locked --manifest-path s3/Cargo.toml --workspace --all-features
          cargo +"$CLIENT_TOOLCHAIN" check --locked --manifest-path s3/Cargo.toml -p prolly-s3-client --no-default-features
      - name: Locked clean-downstream consumers
        run: bash s3/scripts/check_clean_downstream.sh

  rustfs-and-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROLLY_S3_RUSTFS: "1"
      PROLLY_RUSTFS_ENDPOINT: http://127.0.0.1:9000
      PROLLY_RUSTFS_ACCESS_KEY: prollyadmin
      PROLLY_RUSTFS_SECRET_KEY: prolly-local-secret-change-me
      PROLLY_RUSTFS_CONTAINER: prolly-rustfs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: versioned-s3-rustfs-1.94.1
      - name: Install pinned dependency auditor
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Start isolated RustFS
        run: |
          mkdir -p "$RUNNER_TEMP/rustfs-data"
          docker run --detach --name "$PROLLY_RUSTFS_CONTAINER" \
            --publish 127.0.0.1:9000:9000 \
            --env RUSTFS_VOLUMES=/data \
            --env RUSTFS_ADDRESS=0.0.0.0:9000 \
            --env RUSTFS_ACCESS_KEY="$PROLLY_RUSTFS_ACCESS_KEY" \
            --env RUSTFS_SECRET_KEY="$PROLLY_RUSTFS_SECRET_KEY" \
            --env RUSTFS_RPC_SECRET=prolly-ci-rpc-secret \
            --volume "$RUNNER_TEMP/rustfs-data:/data" \
            --health-cmd 'curl -fsS http://127.0.0.1:9000/health' \
            --health-interval 2s --health-timeout 2s --health-retries 60 \
            rustfs/rustfs:1.0.0-beta.10@sha256:60f4f2f41ce95216f8cac676e69f9d90c0bfec458a3bc7fd7fb9b7c2452ac57a
          for attempt in $(seq 1 90); do
            if test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$PROLLY_RUSTFS_CONTAINER")" = healthy; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$PROLLY_RUSTFS_CONTAINER"
          exit 1
      - name: Live RustFS repository suite
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" test --locked
          --manifest-path s3/Cargo.toml -p prolly-s3-client --all-features
          --test rustfs_repository -- --nocapture --test-threads=1
      - name: Executable adapted-client example
        run: >-
          cargo +"$CLIENT_TOOLCHAIN" run --locked
          --manifest-path s3/Cargo.toml -p prolly-s3-client
          --example rustfs_versioned_bucket
      - name: Exact-package rolling and signed-evidence rehearsal
        env:
          PROLLY_RUSTFS_DATA_DIR: ${{ runner.temp }}/rustfs-data
          PROLLY_S3_RELEASE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PROLLY_S3_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          PROLLY_S3_RELEASE_PACKAGE_TARGET: ${{ runner.temp }}/release-build
          PROLLY_S3_RELEASE_ROLLING_TARGET_ROOT: ${{ runner.temp }}/release-rolling-target
          PROLLY_S3_ALLOW_EPHEMERAL_SIGNING: "1"
        run: bash s3/scripts/run_signed_release_rehearsal.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versioned-s3-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: warn
      - name: Stop RustFS
        if: always()
        run: docker rm --force "$PROLLY_RUSTFS_CONTAINER" || true
