[package]
name = "prolly-dynamodb-client-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
aws-sdk-dynamodb = "=1.73.0"
aws-smithy-runtime-api = "=1.12.3"
aws-smithy-types = "=1.5.0"
csv = "1.3"
prolly-dynamodb-client = { path = "../../extensions/dynamodb/client" }
prolly-store-dynamodb = { path = "../../stores/prolly-store-dynamodb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
