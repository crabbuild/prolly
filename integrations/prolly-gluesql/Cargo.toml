[package]
name = "prolly-gluesql"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A transactional, versioned GlueSQL storage engine backed by prolly-map."
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabbuild/prolly"
homepage = "https://github.com/crabbuild/prolly"
documentation = "https://docs.rs/prolly-gluesql"
readme = "README.md"
keywords = ["sql", "database", "versioned", "prolly-tree", "gluesql"]
categories = ["database-implementations"]
include = ["/Cargo.toml", "/README.md", "/examples/**", "/src/**", "/tests/**"]

[lib]
name = "prolly_gluesql"
path = "src/lib.rs"

[features]
default = []
sqlite = ["dep:prolly-store-sqlite"]
redb = ["dep:prolly-store-redb"]
cli = ["sqlite", "dep:clap", "dep:serde_json", "dep:tokio"]

[dependencies]
async-trait = "0.1"
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive"], optional = true }
futures = "0.3"
gluesql-core = "0.19.0"
prolly = { package = "prolly-map", path = "../..", version = "0.7.0" }
prolly-store-redb = { path = "../../stores/prolly-store-redb", version = "0.5.0", optional = true }
prolly-store-sqlite = { path = "../../stores/prolly-store-sqlite", version = "0.5.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
gluesql-test-suite = "0.19.0"
tempfile = "3.27"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "prolly-sql"
path = "src/bin/prolly-sql.rs"
required-features = ["cli"]

[[example]]
name = "sqlite_durable"
required-features = ["sqlite"]

[[example]]
name = "redb_durable"
required-features = ["redb"]
